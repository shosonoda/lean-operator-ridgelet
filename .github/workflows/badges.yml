name: Generated files

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Check that the generated README badges match lean-toolchain
        run: python3 scripts/update-readme-badges.py --check

      - name: Check that the generated comparator review chapter of the blueprint is current
        run: python3 OperatorRidgeletBlueprint/scripts/gen-comparator-chapter.py --check
